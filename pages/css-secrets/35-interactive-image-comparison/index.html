    <div class="container py-4">
        <a href="../index.html" class="back-link mb-4 d-inline-block">

        <div class="card">
            <div class="demo-container">
                <h1 class="demo-title">35 - 交互式的图片对比控件</h1>
                <p class="demo-description">使用 CSS 实现交互式的图片对比控件效果</p>

                <div class="demo-box">
                    <!-- Demo content goes here -->
                    <div class="image-slider">
                        <div
                            onresize="this.nextElementSibling.nextElementSibling.value = this.offsetWidth / this.parentElement.offsetWidth * 100;">
                            <img src="../../../assets/images/adam-sleeping.jpg" alt="Before" />
                        </div>
                        <img src="../../../assets/images/tiger.jpg" alt="After" />
                        <input type="range" min="0" max="100" value="50"
                            oninput="this.previousElementSibling.previousElementSibling.style.width = this.value + '%';" />

                    </div>
                </div>

                <style>
                    .image-slider {
                        position: relative;
                        display: inline-block;
                    }

                    .image-slider>div {
                        position: absolute;
                        top: 0;
                        bottom: 0;
                        left: 0;
                        width: 50%;
                        max-width: 100%;
                        /* 初始宽度 */
                        overflow: hidden;
                        /* 让它可以裁切图片 */
                        resize: horizontal;

                        /* filter: contrast(.5);
                        mix-blend-mode: luminosity; */
                    }


                    .image-slider img {
                        width: 300px;
                        height: 200px;
                        display: block;
                    }

                    .image-slider>div::before {
                        content: '';
                        position: absolute;
                        bottom: 0;
                        right: 0;
                        width: 12px;
                        height: 12px;
                        background: white;
                        cursor: ew-resize;

                        padding: 5px;
                        background:
                            linear-gradient(-45deg, white 50%, transparent 0);
                        background-clip: content-box;
                    }

                    .image-slider input {
                        position: absolute;
                        left: 0;
                        bottom: 10px;
                        width: 100%;
                        margin: 0;
                    }
                </style>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
