        <div class="card">

                <p class="demo-description">使用 CSS 实现通过模糊来弱化背景效果</p>

                <div class="demo-box">
                    <!-- Demo content goes here -->
                    <main
                        onclick="document.querySelector('body').classList.toggle('de-emphasized'); document.querySelector('#dialog').showModal()">
                        Bacon
                        Ipsum dolor sit amet...
                    </main>
                    <dialog id="dialog"
                        onclick="this.close(); document.querySelector('body').classList.toggle('de-emphasized');">
                        O HAI, I'm a dialog. Click on me to dismiss.
                    </dialog>
                </div>

                <style>
                    body {
                        transition: .6s filter;
                    }

                    body.de-emphasized {
                        /* filter: blur(5px); */
                        filter: blur(3px) contrast(.8)brightness(.8);
                    }
                </style>
            </div>
        </div>
    </div>
