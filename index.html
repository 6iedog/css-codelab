<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Codelab — 只做 CSS 实验的静态站点</title>
    <meta name="description" content="CSS Codelab：一个静态的 CSS 实验室，把 CSS 技巧逐条拆开验证，每条技巧一个页面，没有构建步骤。">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="assets/css/common.css" rel="stylesheet">
    <style>
        /* ==================================================================
           首页版式：等宽标题 + 发丝分隔线 + 等宽标注。
           两套配色都从 common.css 的令牌来：
             暗色 = 深色终端（近黑底 + 荧光绿）
             亮色 = 冷白电蓝（纯白底 + 电蓝）
           ================================================================== */

        html {
            scroll-behavior: smooth;
        }

        /* ---------- 首屏 ---------- */
        .hero {
            display: grid;
            grid-template-columns: minmax(0, 7.2fr) minmax(0, 4.8fr);
            gap: clamp(24px, 4vw, 72px);
            align-items: end;
            padding: clamp(56px, 9vw, 120px) 0 clamp(40px, 6vw, 76px);
        }

        .hero-main {
            min-width: 0;
        }

        h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: clamp(46px, 8.6vw, 116px);
            font-weight: 700;
            line-height: 1.02;
            letter-spacing: -0.045em;
            color: var(--text-primary);
        }

        h1 em {
            display: block;
            font-style: normal;
            color: var(--accent);
        }

        .hero-aside {
            padding-bottom: 0.35rem;
            border-bottom: 1px solid var(--line);
        }

        /* ---------- 板块列表：整行可点，悬停擦除底色 ---------- */
        .project-list {
            margin: 0;
            padding: 0;
        }

        .project-card {
            position: relative;
            isolation: isolate;
            display: grid;
            grid-template-columns: 68px minmax(0, 1fr) auto 40px;
            align-items: center;
            gap: clamp(12px, 2.4vw, 32px);
            padding: clamp(24px, 3.4vw, 40px) 0;
            border-bottom: 1px solid var(--line);
            color: inherit;
            text-decoration: none;
            transition: background 0.3s var(--ease), padding-left 0.3s var(--ease);
        }

        .project-card::before {
            content: "";
            position: absolute;
            inset: 0 calc(var(--pad) * -1);
            z-index: -1;
            background: var(--accent-soft);
            opacity: 0;
            transition: opacity 0.3s var(--ease);
        }

        .project-card:hover::before,
        .project-card:focus-visible::before {
            opacity: 1;
        }

        .project-card:hover {
            padding-left: 14px;
        }

        .card-index {
            color: var(--accent);
            font-family: var(--font-mono);
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            font-variant-numeric: tabular-nums;
        }

        .card-body {
            min-width: 0;
        }

        .card-title {
            display: block;
            font-family: var(--font-display);
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            transition: color 0.2s ease;
        }

        .project-card:hover .card-title {
            color: var(--accent);
        }

        .card-desc {
            display: block;
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.65;
        }

        .card-meta {
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            white-space: nowrap;
        }

        .card-go {
            justify-self: end;
            font-family: var(--font-mono);
            font-size: 1.1rem;
            color: var(--text-secondary);
            transition: transform 0.28s var(--ease), color 0.2s ease;
        }

        .project-card:hover .card-go {
            transform: translateX(6px);
            color: var(--accent);
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
                align-items: start;
                gap: 36px;
            }

            .hero-aside {
                border-bottom: 0;
                padding-bottom: 0;
            }
        }

        @media (max-width: 720px) {
            .project-card {
                grid-template-columns: 44px minmax(0, 1fr) 32px;
                gap: 10px 14px;
            }

            .card-meta {
                grid-column: 2;
                grid-row: 2;
            }

            .card-go {
                grid-column: 3;
                grid-row: 1 / span 2;
            }
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-KFVQMWKFHB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-KFVQMWKFHB');
    </script>
</head>
<body>
<header class="top">
    <div class="shell top-inner">
        <a class="wordmark" href="index.html">CSS <em>Codelab</em></a>
        <div class="top-right">
            <div class="btn-group" role="group" aria-label="配色模式">
                <button type="button" class="btn" data-theme="auto">系统</button>
                <button type="button" class="btn" data-theme="light">亮色</button>
                <button type="button" class="btn" data-theme="dark">暗色</button>
            </div>
        </div>
    </div>
</header>

<main class="shell">
    <section class="hero">
        <div class="hero-main rev" style="--d: 0.02s">
            <p class="kicker">~/css-codelab</p>
            <h1>CSS <em>Codelab</em></h1>
        </div>

        <div class="hero-aside rev" style="--d: 0.11s">
            <p class="lead">把 CSS 的每个怪癖摊开来验证：一条技巧一个页面，改完刷新就能看到结果。</p>
            <dl class="stats">
                <div class="stat">
                    <dt>板块</dt>
                    <dd>2</dd>
                </div>
                <div class="stat">
                    <dt>演示</dt>
                    <dd>48</dd>
                </div>
            </dl>
        </div>
    </section>

    <section class="sec" aria-labelledby="boards">
        <h2 class="sec-label" id="boards">板块</h2>
        <div class="project-list">
            <a class="project-card rev" href="pages/css-secrets/index.html" style="--d: 0.2s">
                <span class="card-index">01</span>
                <span class="card-body">
                    <span class="card-title">CSS Secrets</span>
                    <span class="card-desc">《CSS 揭秘》的技巧实验：从边框、形状到动画，每条技巧一个可交互页面。</span>
                </span>
                <span class="card-meta">47 演示 · 7 章</span>
                <span class="card-go" aria-hidden="true">→</span>
            </a>
            <a class="project-card rev" href="pages/modern-css/index.html" style="--d: 0.26s">
                <span class="card-index">02</span>
                <span class="card-body">
                    <span class="card-title">现代 CSS</span>
                    <span class="card-desc">不在书里的那些特性：包含与容器查询、层叠与作用域，一个特性一页，能开能关地验证。</span>
                </span>
                <span class="card-meta">1 演示</span>
                <span class="card-go" aria-hidden="true">→</span>
            </a>
        </div>
    </section>
</main>

<footer class="shell foot">
    <span>CSS Codelab · MIT</span>
    <a href="https://github.com/6iedog/css-codelab">github.com/6iedog/css-codelab →</a>
</footer>

<script src="assets/js/theme.js"></script>
</body>
</html>
